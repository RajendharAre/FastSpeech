# English configuration (Svarah dataset).
# Sections required by the assignment: preprocess, model, train, inference.
# Relative paths are resolved from the English/ folder (run scripts from there).

preprocess:
  dataset: "Svarah"
  path:
    corpus_path: "data/raw"
    lexicon_path: "lexicon/librispeech-lexicon.txt"
    # Optional G2P dictionary for names, built by scripts/build_g2p_names.py.
    # Leave empty until the file exists.
    supplementary_lexicon_path: ""
    raw_path: "data/raw"
    preprocessed_path: "data/preprocessed"
    # MODIFIED(both): the preprocessor consumes these manifests instead of
    # splitting randomly. Build them with scripts/split_dataset.py --seed 1234.
    manifest_train: "manifests/train.csv"
    manifest_val: "manifests/val.csv"
  preprocessing:
    # NEW(both): a clip whose saved mel exceeds model.max_seq_len minus this
    # margin (1000 - 20 = 980 frames, about 11.4 s) is dropped as 'too_long'
    # instead of being silently truncated during training.
    max_seq_len_margin: 20
    text:
      text_cleaners: ["english_cleaners"]
      language: "en"
    audio:
      # MODIFIED(both): must match the HiFi-GAN vocoder settings in
      # hifigan/config.json (22.05 kHz). All source audio is resampled to this.
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000  # required by the HiFi-GAN vocoder
    pitch:
      feature: "phoneme_level"
      normalization: true
    energy:
      feature: "phoneme_level"
      normalization: true

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  # MODIFIED(both): Svarah has 100+ speakers and no speaker with enough audio
  # for a single-speaker model, so the speaker embedding is required (see
  # docs/DATA_STRATEGY.md). Final speaker set is a GATE 1 decision.
  multi_speaker: true
  max_seq_len: 1000
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"  # reference repo's pretrained universal generator

train:
  # NEW(both): fixed seed for reproducible runs. --resume also restores the
  # Python/NumPy/PyTorch RNG state saved in the checkpoint.
  seed: 1234
  path:
    ckpt_path: "checkpoints"
    log_path: "logs"
    result_path: "../Results/English"
  optimizer:
    # Micro-batches per DataLoader batch. For the 50-utterance overfit test
    # set batch_size: 8 and group_size: 1; both values are read from here.
    batch_size: 16
    group_size: 4
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    # MODIFIED(English): reference [300000, 400000, 500000] scaled by 60000/900000
    # so the anneal points stay at the same fractions of the run.
    anneal_steps: [20000, 26000, 33000]
    anneal_rate: 0.3
  step:
    # MODIFIED(English): measured 0.304 s/step on a Kaggle T4 with the 300-step
    # calibration run (2026-11-05); 60000 steps is a ~5.3 h budget.
    total_step: 60000
    log_step: 100
    synth_step: 1000
    val_step: 1000
    save_step: 5000  # MODIFIED(both): reference used 100000, too sparse for a 4-day run

inference:
  restore_step: null  # set to the trained checkpoint step before inference
  # MODIFIED(both): speaker embedding ID used for the test sentences.
  # Which speaker to use is a GATE 1 decision; 0 is only a placeholder.
  speaker_id: 0
  pitch_control: 1.0
  energy_control: 1.0
  duration_control: 1.0
  test_sentences: "../docs/test_sentences.json"
  result_path: "../Results/English"
